name: Validate and deploy Mandarin TiddlyWiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mandarin-wiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tiddler metadata and prerequisites
        run: python3 scripts/validate_wiki.py

      - name: Run validator regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Node (only on GitHub runner)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned TiddlyWiki
        run: npm install --global tiddlywiki@5.4.1

      - name: Prepare reviewed human-audio pilot
        run: |
          bash scripts/create_audio_pilot.sh
          git add assets/audio/nihao.ogg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add credited Mandarin pronunciation audio pilot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build self-contained, read-only Pages edition
        run: |
          tiddlywiki . --build index
          mkdir -p public/audio
          cp assets/audio/*.ogg public/audio/

      - name: Check generated site
        shell: bash
        run: |
          test -s public/index.html
          grep -q "D's Mandarin Time" public/index.html
          grep -q "师父有一本书" public/index.html
          test -s public/audio/nihao.ogg
          echo "Built static wiki:"
          ls -lh public/index.html

      - name: Upload portable HTML for preview and offline use
        uses: actions/upload-artifact@v4
        with:
          name: mandarin-wiki-static-html
          path: public

      # GitHub Pages is a one-time repository setting; until enabled, CI can still pass.
      - name: Configure Pages
        if: ${{ github.event.repository.has_pages }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event.repository.has_pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event.repository.has_pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
