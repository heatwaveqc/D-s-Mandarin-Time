name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

# PRs are untrusted content: no write token, deployment credentials, or branch mutation.
permissions:
  contents: read

concurrency:
  group: mandarin-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Validate tiddler metadata, lessons, and references
        run: python3 scripts/validate_wiki.py

      - name: Run validator regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned TiddlyWiki
        run: npm install --global tiddlywiki@5.4.1

      - name: Prepare reference audio without committing
        run: bash scripts/create_audio_pilot.sh

      - name: Build static wiki
        run: |
          tiddlywiki . --build index
          mkdir -p public/audio
          cp assets/audio/*.ogg public/audio/

      - name: Verify output
        run: |
          test -s public/index.html
          grep -q "D's Mandarin Time" public/index.html
          grep -q "师父有一本书" public/index.html
          test -s public/audio/nihao.ogg

      - name: Upload build preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandarin-pr-preview
          path: public
